<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-skin="tech">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图枢 · CAD 图纸管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.298.0/dist/umd/lucide.min.js"></script>
<style>
/* ==========================================================
   主题变量 —— 4 种组合：轻奢(明/暗) × 科技(明/暗)
   ========================================================== */
html[data-skin="elegant"][data-theme="light"]{
  --bg:#F2EEE6; --bg-soft:#EDE8DE; --panel:#FDFCF8; --panel-2:#F6F2EA; --panel-top:#F9F6F0;
  --line:#E3DCCB; --line-strong:#CFC5AE; --hover:rgba(120,95,50,.06); --active:rgba(140,110,60,.1);
  --text-1:#292419; --text-2:#6E6552; --text-3:#A79C85;
  --accent:#9C7A44; --accent-2:#C6A265; --accent-ink:#FFFBF2; --accent-soft:rgba(160,124,66,.12);
  --ok:#4E7A57; --warn:#A8762A; --danger:#A5463E; --info:#4A6FA5;
  --shadow:0 14px 34px rgba(80,64,35,.10), 0 2px 6px rgba(80,64,35,.05);
  --font-display:'Noto Serif SC',serif; --radius:15px; --grid:rgba(120,95,50,.05);
  --cad-bg:#FDFCF7; --cad-line:#332F24; --cad-center:#B08D57; --cad-dim:#8B8371; --cad-text:#3A3527; --cad-hatch:#CDC3AA; --cad-frame:#4A4436;
}
html[data-skin="elegant"][data-theme="dark"]{
  --bg:#141109; --bg:#141109; --bg-soft:#1A160E; --panel:#1E1912; --panel-2:#262017; --panel-top:#1B1710;
  --line:#332B1D; --line-strong:#49402C; --hover:rgba(198,162,101,.07); --active:rgba(198,162,101,.12);
  --text-1:#EFE7D6; --text-2:#B0A48B; --text-3:#7C7259;
  --accent:#C6A265; --accent-2:#E4C98E; --accent-ink:#241B0D; --accent-soft:rgba(198,162,101,.13);
  --ok:#8DB98E; --warn:#D9A75C; --danger:#D07B72; --info:#8AADD9;
  --shadow:0 18px 44px rgba(0,0,0,.5); --font-display:'Noto Serif SC',serif; --radius:15px;
  --grid:rgba(198,162,101,.04);
  --cad-bg:#171208; --cad-line:#E8DFC9; --cad-center:#C6A265; --cad-dim:#8F English8670; --cad-dim:#8F8670; --cad-text:#E8DFC9; --cad-hatch:#4E4430; --cad-frame:#B9AD8E;
}
html[data-skin="tech"][data-theme="light"]{
  --bg:#EAF1F7; --bg-soft:#E2EBF3; --panel:#FFFFFF; --panel-2:#F2F7FB; --panel-top:#F8FBFE;
  --line:#D8E3EC; --line-strong:#B9CCDA; --hover:rgba(10,110,145,.06); --active:rgba(10,110,145,.11);
  --text-1:#0E1B27; --text-2:#4E6478; --text-3:#8AA1B3;
  --accent:#0A7E9E; --accent-2:#0EA5C9; --accent-ink:#F2FDFF; --accent-soft:rgba(10,126,158,.1);
  --ok:#15803D; --warn:#B45309; --danger:#BE3B36; --info:#2563EB;
  --glow:rgba(14,165,201,.35); --shadow:0 12px 30px rgba(15,60,90,.10);
  --font-display:'Noto Sans SC',sans-serif; --radius:13px; --grid:rgba(10,110,145,.07);
  --cad-bg:#F7FBFE; --cad-line:#123247; --cad-center:#0A7E9E; --cad-dim:#5B7285; --cad-text:#123247; --cad-hatch:#AFC9D8; --cad-frame:#33566E;
}
html[data-skin="tech"][data-theme="dark"]{
  --bg:#04070E; --bg-soft:#060B15; --panel:#0A1322; --panel-2:#0E1929; --panel-top:#0A1220;
  --line:#152641; --line-strong:#1F3A5F; --hover:rgba(34,211,238,.06); --active:rgba(34,211,238,.12);
  --text-1:#E4F2FF; --text-2:#7E97B4; --text-3:#4E6785;
  --accent:#22D3EE; --accent-2:#818CF8; --accent-ink:#03222B; --accent-soft:rgba(34,211,238,.11);
  --ok:#34D399; --warn:#FBBF24; --danger:#F87171; --info:#60A5FA;
  --glow:rgba(34,211,238,.4); --shadow:0 18px 44px rgba(0,0,0,.55);
  --font-display:'Noto Sans SC',sans-serif; --radius:13px; --grid:rgba(34,211,238,.05);
  --cad-bg:#050E1A; --cad-line:#CDEEFF; --cad-center:#22D3EE; --cad-dim:#5E7A96; --cad-text:#D9F4FF; --cad-hatch:#1D3A5A; --cad-frame:#6E9CC0;
}

/* ==========================================================
   基础
   ========================================================== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Sans SC',sans-serif; background:var(--bg-soft); color:var(--text-1);
  font-size:13.5px; overflow:hidden; padding:14px;
  transition:background-color .5s ease;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text-1)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
i[data-lucide]{width:16px;height:16px}
.mono{font-family:'JetBrains Mono',monospace}

/* 背景特效（科技皮肤显示网格与光斑） */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;inset:-60px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 0%,transparent 78%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 0%,transparent 78%);animation:gridMove 26s linear infinite}
.orb{position:absolute;width:480px;height:480px;border-radius:50%;filter:blur(90px);opacity:.35}
.orb.o1{background:var(--accent);top:-220px;left:8%;animation:orbFloat 20s ease-in-out infinite alternate}
.orb.o2{background:var(--accent-2);bottom:-260px;right:5%;opacity:.22;animation:orbFloat 26s ease-in-out infinite alternate-reverse}
html[data-skin="elegant"] .bg-grid,html[data-skin="elegant"] .orb{display:none}
@keyframes gridMove{to{transform:translateY(46px)}}
@keyframes orbFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,50px) scale(1.15)}}

/* ==========================================================
   无边框窗口骨架
   ========================================================== */
#app{
  position:relative;z-index:1;height:calc(100vh - 28px);display:flex;flex-direction:column;
  background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
  transition:background-color .5s ease,border-color .5s ease;
}

/* —— 自绘标题栏（Tauri 下可拖拽） —— */
#titlebar{
  height:48px;flex:none;display:flex;align-items:center;gap:14px;padding-left:16px;
  background:var(--panel-top);border-bottom:1px solid var(--line);
  -webkit-app-region:drag;user-select:none;
  transition:background-color .5s ease,border-color .5s ease;
}
.tb-logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:.5px}
.tb-logo .mark{width:24px;height:24px;flex:none}
.tb-logo .sub{font-size:10.5px;color:var(--text-3);font-weight:400;font-family:'JetBrains Mono',monospace;margin-left:2px;letter-spacing:0}
.tb-search{
  display:flex;align-items:center;gap:8px;width:300px;height:30px;padding:0 11px;margin-left:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text-3);
  font-size:12.5px;cursor:pointer;-webkit-app-region:no-drag;transition:border-color .25s;
}
.tb-search:hover{border-color:var(--accent)}
.tb-search i{width:14px;height:14px;flex:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:6px;-webkit-app-region:no-drag}
/* 皮肤切换分段控件 */
.skin-switch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.skin-switch button{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:6px;font-size:12px;color:var(--text-2);transition:all .3s}
.skin-switch button i{width:13px;height:13px}
.skin-switch button.active{background:var(--accent);color:var(--accent-ink)}
html[data-skin="tech"] .skin-switch button.active{box-shadow:0 0 14px var(--glow)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--text-2);transition:all .25s;position:relative}
.icon-btn:hover{background:var(--hover);color:var(--text-1)}
.icon-btn i{width:16px;height:16px}
.tb-bell .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--panel-top)}
html[data-skin="tech"] .tb-bell .dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 5px rgba(248,113,113,0)}}
/* 窗口控制按钮组 */
.win-btns{display:flex;height:100%;margin-left:4px}
.win-btn{width:46px;height:100%;display:grid;place-items:center;color:var(--text-2);transition:background .2s,color .2s;border-radius:10px 10px 0 0}
.win-btn:hover{background:var(--hover);color:var(--text-1)}
.win-btn.close:hover{background:#E81123;color:#fff}
.win-btn i{width:15px;height:15px}

/* —— 主体布局 —— */
#layout{flex:1;display:flex;min-height:0}
#sidebar{
  width:216px;flex:none;display:flex;flex-direction:column;background:var(--panel-top);
  border-right:1px solid var(--line);padding:14px 12px;transition:width .32s cubic-bezier(.4,0,.2,1),background-color .5s ease;
}
#sidebar.collapsed{width:64px}
#sidebar.collapsed .nav-label,#sidebar.collapsed .nav-text,#sidebar.collapsed .badge,#sidebar.collapsed .user-info,#sidebar.collapsed .nav-group,#sidebar.collapsed .collapse-txt{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px 0}
.nav-group{font-size:10.5px;color:var(--text-3);letter-spacing:2px;padding:14px 10px 7px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--text-2);font-size:13.5px;cursor:pointer;margin-bottom:2px;transition:all .25s;
}
.nav-item i{width:17px;height:17px;flex:none}
.nav-item:hover{background:var(--hover);color:var(--text-1)}
.nav-item.active{color:var(--accent);background:var(--active)}
html[data-skin="tech"] .nav-item.active{background:linear-gradient(90deg,var(--accent-soft),transparent)}
html[data-skin="tech"] .nav-item.active i{filter:drop-shadow(0 0 7px var(--glow))}
html[data-skin="elegant"] .nav-item.active::after{content:'';position:absolute;right:10px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.75}
.nav-text{flex:1;white-space:nowrap}
.badge{min-width:20px;height:19px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:10.5px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700}
html[data-skin="tech"] .badge{box-shadow:0 0 10px rgba(248,113,113,.55)}
.side-foot{margin-top:auto}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.avatar{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
html[data-skin="tech"] .avatar{box-shadow:0 0 12px var(--glow)}
.user-info{flex:1;min-width:0}
.user-info b{display:block;font-size:12.5px}
.user-info span{font-size:10.5px;color:var(--text-3)}
.collapse-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border-radius:9px;color:var(--text-3);font-size:12px;transition:all .25s}
.collapse-btn:hover{background:var(--hover);color:var(--text-1)}
.collapse-btn i{width:15px;height:15px;transition:transform .32s}
#sidebar.collapsed .collapse-btn i{transform:rotate(180deg)}

#main{flex:1;min-width:0;display:flex}
#content{flex:1;display:flex;flex-direction:column;min-height:0}
.page{flex:1;min-height:0;overflow-y:auto;padding:22px 26px}
.page.detail-page{display:flex;flex-direction:column;overflow:hidden;padding:0}
.page-anim{animation:pageIn .4s cubic-bezier(.22,.8,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}}

/* —— 状态栏 —— */
#statusbar{
  height:27px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;
  background:var(--panel-top);border-top:1px solid var(--line);font-size:11px;color:var(--text-3);
  font-family:'JetBrains Mono',monospace;user-select:none;transition:background-color .5s ease;
}
#statusbar .sp{margin-left:auto}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;vertical-align:0}
html[data-skin="tech"] .status-dot{animation:pulse 2.4s infinite;--c:var(--ok)}
#statusbar .zoom-ind{color:var(--accent)}

/* ==========================================================
   通用组件
   ========================================================== */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .3s ease,border-color .3s,box-shadow .3s,background-color .5s ease}
.card-pad{padding:18px 20px}
html[data-skin="elegant"] .card::before{content:'';position:absolute;top:0;left:26px;right:26px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 50%,transparent),transparent)}
html[data-skin="tech"] .card{overflow:hidden}
html[data-skin="tech"] .card::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,var(--accent-soft) 50%,transparent 58%);transform:translateX(-120%)}
html[data-skin="tech"] .card:hover::after{animation:sweep .9s ease}
html[data-skin="tech"] .card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 1px var(--glow),0 14px 40px rgba(0,0,0,.35),0 0 30px var(--glow);transform:translateY(-2px)}
html[data-skin="elegant"] .card:hover{transform:translateY(-2px)}
@keyframes sweep{to{transform:translateX(120%)}}

.card-title{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:900;font-size:14.5px;padding:15px 20px 0}
.card-title i{width:16px;height:16px;color:var(--accent)}
.card-title .hint{margin-left:auto;font-family:'Noto Sans SC';font-weight:400;font-size:11px;color:var(--text-3)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:10px;font-size:12.5px;font-weight:500;transition:all .25s;border:1px solid var(--line);background:var(--panel);color:var(--text-1)}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn i{width:14px;height:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:var(--accent-2)}
html[data-skin="tech"] .btn.primary{box-shadow:0 0 16px var(--glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:8px}
.btn:active{transform:scale(.97)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2.5px 10px;border-radius:99px;font-size:11px;border:1px solid;white-space:nowrap;font-weight:500}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 36%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 36%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.tag.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 36%,transparent);background:color-mix(in srgb,var(--info) 9%,transparent)}
.tag.mute{color:var(--text-3);border-color:var(--line);background:var(--panel-2)}
.tag.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 36%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.tag.plain{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.tag.plain::before{display:none}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;color:var(--text-3);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);letter-spacing:.4px;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .18s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .num{font-family:'JetBrains Mono',monospace;font-size:12px}
.tbl .link{color:var(--accent);cursor:pointer;font-weight:500}
.tbl .link:hover{text-decoration:underline}
.tbl tfoot td{border-top:1px solid var(--line);border-bottom:none;font-weight:700;background:var(--panel-2)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);outline:none;transition:all .25s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:auto;padding:9px 12px;resize:vertical;min-height:64px}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 17px) 15px,calc(100% - 12px) 15px;background-size:5px 5px;background-repeat:no-repeat}

input[type=checkbox],input[type=radio]{appearance:none;width:16px;height:16px;flex:none;border:1.5px solid var(--line-strong);cursor:pointer;position:relative;transition:all .2s;background:var(--panel)}
input[type=checkbox]{border-radius:4.5px}
input[type=radio]{border-radius:50%}
input[type=checkbox]:checked,input[type=radio]:checked{border-color:var(--accent);background:var(--accent)}
input[type=checkbox]:checked::after{content:'';position:absolute;left:4.4px;top:1px;width:4px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(42deg)}
input[type=radio]:checked::after{content:'';position:absolute;inset:3.2px;border-radius:50%;background:var(--accent-ink)}
html[data-skin="tech"] input[type=checkbox]:checked,html[data-skin="tech"] input[type=radio]:checked{box-shadow:0 0 9px var(--glow)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:46px 20px;color:var(--text-3);text-align:center}
.empty i{width:34px;height:34px;opacity:.45}
.empty .t{font-size:13px;color:var(--text-2)}

/* 下拉菜单 */
.dropdown{position:absolute;z-index:60;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;animation:dropIn .18s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-5px) scale(.97)}}
.dd-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;border-radius:7px;font-size:12.5px;color:var(--text-1);text-align:left;transition:all .15s}
.dd-item:hover{background:var(--hover)}
.dd-item i{width:14px;height:14px;color:var(--text-3)}
.dd-item.danger{color:var(--danger)}
.dd-item.danger i{color:var(--danger)}
.dd-sep{height:1px;background:var(--line);margin:4px 6px}

/* Toast */
#toastWrap{position:fixed;top:70px;right:34px;z-index:200;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);max-width:360px}
.toast i{width:16px;height:16px;flex:none}
.toast.ok i{color:var(--ok)} .toast.info i{color:var(--info)} .toast.warn i{color:var(--warn)}
html[data-skin="tech"] .toast{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 0 20px var(--glow),var(--shadow)}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* Modal */
#modalWrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#modalWrap.show{display:flex}
#modalWrap .mask{position:absolute;inset:0;background:rgba(4,8,15,.55);backdrop-filter:blur(5px);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{position:relative;width:460px;max-width:92vw;max-height:84vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);animation:modalIn .32s cubic-bezier(.2,.9,.3,1.15)}
html[data-skin="tech"] .modal{box-shadow:0 0 40px var(--glow),var(--shadow)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
.modal-head{display:flex;align-items:center;padding:16px 20px 13px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--font-display);font-size:15px;font-weight:900;flex:1}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:1.5px dashed var(--line-strong);border-radius:12px;color:var(--text-3);cursor:pointer;transition:all .25s;text-align:center;font-size:12px}
.dropzone:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dropzone i{width:26px;height:26px}
.radio-row{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:all .25s;margin-bottom:8px}
.radio-row:hover{border-color:var(--line-strong)}
.radio-row.on{border-color:var(--accent);background:var(--accent-soft)}
.radio-row .rt b{display:block;font-size:12.5px;margin-bottom:2px}
.radio-row .rt span{font-size:11px;color:var(--text-3);line-height:1.5}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 0;border-radius:6px;font-size:12px;color:var(--text-2);transition:all .25s}
.seg button.active{background:var(--accent);color:var(--accent-ink)}
.note{display:flex;gap:9px;padding:11px 13px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-size:11.5px;color:var(--text-2);line-height:1.65}
.note i{width:14px;height:14px;flex:none;color:var(--accent);margin-top:2px}

/* ==========================================================
   工作台
   ========================================================== */
.dash-hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.dash-hero h1{font-family:var(--font-display);font-size:23px;font-weight:900}
.dash-hero p{color:var(--text-3);font-size:12px;margin-top:5px}
.dash-hero .acts{margin-left:auto;display:flex;gap:9px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat-card{padding:17px 19px;overflow:hidden}
html[data-skin="tech"] .stat-card::before{content:'';position:absolute;top:10px;right:12px;width:11px;height:11px;border-top:1.5px solid var(--accent);border-right:1.5px solid var(--accent);opacity:.5;border-radius:2px}
.stat-card .lbl{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.stat-card .lbl i{width:14px;height:14px;color:var(--accent)}
.stat-card .val{font-family:'JetBrains Mono',monospace;font-size:29px;font-weight:700;letter-spacing:-.5px;line-height:1}
html[data-skin="tech"] .stat-card .val{text-shadow:0 0 18px var(--glow)}
.stat-card .delta{font-size:11px;color:var(--text-3);margin-top:9px;font-family:'JetBrains Mono',monospace}
.stat-card .delta b{color:var(--ok);font-weight:500}
.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:14px}
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-ic{width:29px;height:29px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.feed-ic i{width:14px;height:14px}
.feed-ic.view i{color:var(--info)} .feed-ic.edit i{color:var(--warn)} .feed-ic.branch i{color:var(--accent)} .feed-ic.borrow i{color:var(--accent-2)} .feed-ic.check i{color:var(--ok)} .feed-ic.back i{color:var(--danger)}
.feed-txt{flex:1;font-size:12.5px;line-height:1.55}
.feed-txt b{font-weight:500;color:var(--accent)}
.feed-time{font-size:10.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace;flex:none;margin-top:2px}
.todo-item{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.todo-info{flex:1;min-width:0}
.todo-info b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-info span{font-size:11px;color:var(--text-3)}
.todo-acts{display:flex;gap:6px;flex:none}
.dash-foot{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px}
.hbar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:9px}
.hbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));animation:growBar 1.1s cubic-bezier(.2,.8,.3,1)}
@keyframes growBar{from{width:0!important}}
.mini-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--text-2)}
.mini-row b{font-family:'JetBrains Mono',monospace;color:var(--text-1);font-weight:500}

/* ==========================================================
   图纸库
   ========================================================== */
.lib-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.lib-head .search-box{display:flex;align-items:center;gap:8px;width:320px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);transition:all .25s}
.lib-head .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lib-head .search-box i{width:15px;height:15px;color:var(--text-3);flex:none}
.lib-head .search-box input{border:none;outline:none;background:none;flex:1;font-size:12.5px}
.lib-title{font-family:var(--font-display);font-size:19px;font-weight:900;margin-right:4px}
.lib-count{font-size:11.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace}

/* ==========================================================
   图纸详情
   ========================================================== */
.detail-head{padding:18px 26px 0;flex:none}
.crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);margin-bottom:11px}
.crumb span{cursor:pointer}.crumb span:hover{color:var(--accent)}
.crumb i{width:12px;height:12px}
.dh-row{display:flex;align-items:flex-start;gap:14px}
.dh-main{flex:1;min-width:0}
.dh-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dh-title h2{font-family:var(--font-display);font-size:21px;font-weight:900}
.dh-no{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:7px;border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.dh-meta{display:flex;gap:7px 18px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:9px}
.dh-meta b{color:var(--text-1);font-weight:500}
.dh-acts{display:flex;gap:9px;flex:none}
.subnav{display:flex;gap:2px;padding:15px 26px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subtab{display:flex;align-items:center;gap:7px;padding:9px 14px 11px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;transition:all .22s;white-space:nowrap;border-radius:8px 8px 0 0;position:relative}
.subtab i{width:14.5px;height:14.5px}
.subtab:hover{color:var(--text-1);background:var(--hover)}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
html[data-skin="tech"] .subtab.active i{filter:drop-shadow(0 0 6px var(--glow))}
.tab-body{flex:1;min-height:0;overflow-y:auto;padding:20px 26px 26px}
.tab-body.no-scroll{overflow:hidden;display:flex;flex-direction:column;padding:16px 26px 16px}
.tab-anim{animation:pageIn .35s cubic-bezier(.22,.8,.3,1)}

/* —— 结构树 —— */
.struct-grid{display:grid;grid-template-columns:340px 1fr;gap:14px;height:100%;min-height:0}
.struct-grid .card{display:flex;flex-direction:column;min-height:0}
.tree{padding:10px 12px;overflow-y:auto;flex:1}
.tree-node .row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:all .18s;font-size:12.5px}
.tree-node .row:hover{background:var(--hover)}
.tree-node .row.sel{background:var(--active)}
.tree-node .row.sel .tname{color:var(--accent);font-weight:700}
.tree-node .caret{width:15px;height:15px;flex:none;color:var(--text-3);transition:transform .25s}
.tree-node.closed .caret{transform:rotate(-90deg)}
.tree-node.closed>.children{display:none}
.tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tico{width:15px;height:15px;flex:none;color:var(--accent)}
.children{margin-left:19px;border-left:1px dashed var(--line-strong);padding-left:4px}
.children .row{margin-left:0 }
.tno{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3)}
.sel-panel{padding:20px;overflow-y:auto}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px}
.kv .k{font-size:11px;color:var(--text-3);margin-bottom:4px}
.kv .v{font-size:13px;font-weight:500}
.struct-map{margin-top:18px;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:12px;font-size:11.5px;color:var(--text-2);line-height:1.9}
.struct-map b{color:var(--accent)}

/* —— 版本时间线 —— */
.ver-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.timeline{padding:6px 20px 14px}
.tl-item{position:relative;padding:0 0 22px 26px}
.tl-item::before{content:'';position:absolute;left:5.5px;top:16px;bottom:-2px;width:1.5px;background:var(--line-strong)}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--line-strong);background:var(--panel)}
.tl-item.cur .tl-dot{border-color:var(--accent);background:var(--accent)}
html[data-skin="tech"] .tl-item.cur .tl-dot{box-shadow:0 0 12px var(--glow)}
.tl-head{display:flex;align-items:center;gap:10px}
.tl-head .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px}
.tl-body{font-size:12px;color:var(--text-2);margin-top:5px;line-height:1.6}
.tl-meta{font-size:11px;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin-top:4px}
.branch-card{padding:15px 17px;margin-bottom:11px}
.branch-card .bh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.branch-card .bh b{font-family:'JetBrains Mono',monospace;font-size:13.5px}
.branch-card .bh .btn{margin-left:auto}
.branch-card .bd{font-size:12px;color:var(--text-2);line-height:1.65}
.branch-card.disabled{opacity:.62}

/* —— 借用 —— */
.borrow-note{margin-bottom:14px}
.demo-sync{display:flex;gap:9px;align-items:flex-start;margin-top:11px;flex-wrap:wrap}

/* —— 审核节点 —— */
.review-nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.rn-card{padding:16px;display:flex;flex-direction:column;gap:9px}
.rn-top{display:flex;align-items:center;gap:10px}
.rn-ring{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);color:var(--text-3)}
.rn-card.pass .rn-ring{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.rn-card.pending .rn-ring{border-color:var(--warn);color:var(--warn)}
html[data-skin="tech"] .rn-card.pending .rn-ring{animation:ringPulse 1.6s infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 40%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.rn-ring i{width:15px;height:15px}
.rn-name{font-weight:700;font-size:13.5px}
.rn-user{font-size:11px;color:var(--text-3)}
.rn-opinion{font-size:11.5px;color:var(--text-2);background:var(--panel-2);border-radius:8px;padding:8px 10px;line-height:1.6;min-height:38px}
.rn-time{font-size:10.5px;color:var(--text-3);font-family:'JetBrains Mono',monospace}
.rn-acts{display:flex;gap:7px;margin-top:auto}
.review-progress{display:flex;align-items:center;gap:14px;padding:15px 20px}
.rp-track{flex:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.rp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.3,1)}
html[data-skin="tech"] .rp-fill{box-shadow:0 0 12px var(--glow)}
.rp-txt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-2);white-space:nowrap}

/* —— 属性 —— */
.props-section{margin-bottom:16px}
.props-section h4{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:15px 20px 11px;color:var(--text-1)}
.props-section h4 i{width:14px;height:14px;color:var(--accent)}

/* —— CAD 浏览器 —— */
.viewer{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.v-toolbar{display:flex;align-items:center;gap:6px;padding:9px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.v-group{display:flex;align-items:center;gap:3px;padding:0 8px 0 0;margin-right:6px;border-right:1px solid var(--line)}
.v-group:last-child{border-right:none;margin-left:auto;padding-right:0}
.v-btn{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);transition:all .2s}
.v-btn:hover{background:var(--hover);color:var(--text-1)}
.v-btn.on{color:var(--accent);background:var(--active)}
html[data-skin="tech"] .v-btn.on{box-shadow:inset 0 0 8px var(--glow)}
.v-btn i{width:15.5px;height:15.5px}
.v-zoomlbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-2);min-width:44px;text-align:center}
.v-main{flex:1;min-height:0;display:flex;position:relative}
.layer-panel{width:172px;flex:none;border-right:1px solid var(--line);padding:13px 12px;overflow-y:auto;transition:width .3s, padding .3s}
.layer-panel.hidden{width:0;padding:0;border-right:none;overflow:hidden}
.lp-title{font-size:10.5px;letter-spacing:2px;color:var(--text-3);padding:0 6px 9px;font-family:'JetBrains Mono',monospace}
.layer-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:background .18s;user-select:none}
.layer-item:hover{background:var(--hover)}
.layer-item span{flex:1}
.ly-swatch{width:16px;height:4px;border-radius:99px;flex:none}
.v-canvas{flex:1;position:relative;overflow:hidden;background:var(--cad-bg);cursor:grab;touch-action:none}
.v-canvas.dragging{cursor:grabbing}
.v-canvas canvas,.v-canvas svg{display:block}
#cadStage{position:absolute;left:0;top:0;width:1000px;height:660px;transform-origin:0 0}
#cadStage .inner{position:relative;width:100%;height:100%}
#cadOverlay{position:absolute;inset:0;pointer-events:none}
.v-hud{position:absolute;left:13px;bottom:11px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--cad-dim);pointer-events:none;opacity:.85}
.v-scanline{position:absolute;left:0;right:0;height:90px;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 6%,transparent),transparent);animation:scanMove 5.5s linear infinite}
html[data-skin="elegant"] .v-scanline,html[data-theme="light"][data-skin="tech"] .v-scanline{display:none}
@keyframes scanMove{from{top:-90px}to{top:100%}}
.v-info{display:flex;align-items:center;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--text-3);flex-wrap:wrap;font-family:'JetBrains Mono',monospace}
.v-info .fi{display:flex;align-items:center;gap:6px}
.v-info i{width:13px;height:13px;color:var(--accent)}

/* CAD 图线型（跟随主题） */
#cadSvg .ln{stroke:var(--cad-line);fill:none;stroke-linecap:round}
#cadSvg .thick{stroke-width:2.1}
#cadSvg .thin{stroke-width:.95}
#cadSvg .ctr{stroke:var(--cad-center);fill:none;stroke-width:.9;stroke-dasharray:15 4 3 4}
#cadSvg .dim{stroke:var(--cad-dim);fill:none;stroke-width:.8}
#cadSvg .txt{fill:var(--cad-text);font-family:'JetBrains Mono',monospace;font-size:11px}
#cadSvg .txt-s{fill:var(--cad-text);font-family:'JetBrains Mono',monospace;font-size:9.5px}
#cadSvg .txt-lbl{fill:var(--cad-dim);font-family:'Noto Sans SC',sans-serif;font-size:9.5px}
#cadSvg .fline{stroke:var(--cad-frame);fill:none}
#cadSvg .m-arr{fill:var(--cad-dim);stroke:none}
#cadSvg .h-line{stroke:var(--cad-hatch);stroke-width:.75}
#cadSvg .hole-fill{fill:var(--cad-bg);stroke:var(--cad-line);stroke-width:1}

/* ==========================================================
   管理后台 & 审核
   ========================================================== */
.admin-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.admin-tabs .subtab{border:1px solid var(--line);border-radius:10px;border-bottom:1px solid var(--line);padding:8px 16px}
.admin-tabs .subtab.active{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.section-head{display:flex;align-items:center;gap:10px;margin:4px 0 13px}
.section-head h3{font-family:var(--font-display);font-size:15.5px;font-weight:900}
.section-head .btn{margin-left:auto}

@media (max-width:1180px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .dash-grid,.ver-grid,.dash-foot{grid-template-columns:1fr}
  .review-nodes{grid-template-columns:repeat(2,1fr)}
  .struct-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 背景特效层（科技皮肤可见） -->
<div class="bg-fx"><div class="bg-grid"></div><div class="orb o1"></div><div class="orb o2"></div></div>

<div id="app">
  <!-- ▼▼ 自绘无边框标题栏（Tauri 环境下 -webkit-app-region:drag 即可拖动窗口） -->
  <header id="titlebar">
    <div class="tb-logo">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="var(--accent)" stroke-width="2"/>
        <path d="M7 16 L12 7 L17 16" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="1.6" fill="var(--accent-2)"/>
      </svg>
      图枢 <span class="sub">CAD·PDM</span>
    </div>
    <div class="tb-search" data-action="global-search">
      <i data-lucide="search"></i><span>搜索图号 / 名称 / 厂商 / 材料…</span>
    </div>
    <div class="tb-right">
      <div class="skin-switch">
        <button data-skin-btn="elegant"><i data-lucide="sparkles"></i>轻奢</button>
        <button data-skin-btn="tech" class="active"><i data-lucide="zap"></i>科技</button>
      </div>
      <button class="icon-btn" id="themeBtn" data-action="toggle-theme" title="切换 明 / 暗"><i data-lucide="sun"></i></button>
      <button class="icon-btn tb-bell" data-action="bell" title="通知"><i data-lucide="bell"></i><span class="dot"></span></button>
      <div class="win-btns">
        <button class="win-btn" data-action="win-min" title="最小化"><i data-lucide="minus"></i></button>
        <button class="win-btn" data-action="win-max" title="最大化 / 还原"><i data-lucide="square"></i></button>
        <button class="win-btn close" data-action="win-close" title="关闭"><i data-lucide="x"></i></button>
      </div>
    </div>
  </header>

  <div id="layout">
    <!-- ▼ 主导航：只放应用级功能，图纸属性类入口在图纸详情内 -->
    <aside id="sidebar">
      <nav id="navBox"></nav>
      <div class="side-foot">
        <div class="side-user">
          <div class="avatar">陈</div>
          <div class="user-info"><b>陈工</b><span>设计组 · 管理员</span></div>
          <button class="icon-btn" data-action="logout" title="切换账号" style="width:26px;height:26px"><i data-lucide="log-out"></i></button>

function animateCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.dataset.count,t0=performance.now(),dur=950;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString();
      if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

  state.histFilter=state.histFilter||'';

  }

/* ============================================================
   CAD 视图交互（缩放 / 平移 / 旋转 / 测量）
   ============================================================ */
function applyView(){
  const st=$('#cadStage'); if(!st)return;
  const v=state.view;
  st.style.transform=`translate(${v.x}px,${v.y}px) rotate(${v.rot}deg) scale(${v.k})`;
  const pct=Math.round(v.k*100);
  const a=$('#vZoomLbl'); if(a)a.textContent=pct+'%';
  const b=$('#zoomInd'); if(b)b.textContent='缩放 '+pct+'%';
}
function zoomAt(cx,cy,f){
  const cv=$('#vCanvas'); if(!cv)return;
  const r=cv.getBoundingClientRect(),v=state.view;
  const k2=Math.min(8,Math.max(.2,v.k*f));
  if(Math.abs(k2-v.k)<1e-6)return;
  const th=v.rot*Math.PI/180;
  const dx=cx-r.left-v.x,dy=cy-r.top-v.y;
  const ux=( dx*Math.cos(th)+dy*Math.sin(th))/v.k;
  const uy=(-dx*Math.sin(th)+dy*Math.cos(th))/v.k;
  const sx=k2*ux,sy=k2*uy;
  v.x=cx-r.left-(sx*Math.cos(th)-sy*Math.sin(th));
  v.y=cy-r.top -(sx*Math.sin(th)+sy*Math.cos(th));
  v.k=k2; applyView();
}
function zoomAtCenter(f){
  const cv=$('#vCanvas'); if(!cv)return;
  const r=cv.getBoundingClientRect();
  zoomAt(r.left+r.width/2,r.top+r.height/2,f);
}
function fitView(){
  const cv=$('#vCanvas'); if(!cv)return;
  const r=cv.getBoundingClientRect(),v=state.view;
  const rot90=v.rot%180!==0;
  const w=rot90?660:1000,h=rot90?1000:660;
  const k=Math.min((r.width-70)/w,(r.height-70)/h);
  v.k=k;
  const th=v.rot*Math.PI/180,sx=k*500,sy=k*330;
  v.x=r.width/2-(sx*Math.cos(th)-sy*Math.sin(th));
  v.y=r.height/2-(sx*Math.sin(th)+sy*Math.cos(th));
  applyView();
}
function rotateView(){
  const cv=$('#vCanvas'); if(!cv)return;
  const r=cv.getBoundingClientRect(),v=state.view;
  const th=v.rot*Math.PI/180;
  const dx=r.width/2-v.x,dy=r.height/2-v.y;
  const ux=( dx*Math.cos(th)+dy*Math.sin(th))/v.k;
  const uy=(-dx*Math.sin(th)+dy*Math.cos(th))/v.k;
  v.rot=(v.rot+90)%360;
  const th2=v.rot*Math.PI/180,sx=v.k*ux,sy=v.k*uy;
  v.x=r.width/2-(sx*Math.cos(th2)-sy*Math.sin(th2));
  v.y=r.height/2-(sx*Math.sin(th2)+sy*Math.cos(th2));
  applyView();
}
function screenToSvg(cx,cy){
  const r=$('#vCanvas').getBoundingClientRect(),v=state.view,th=v.rot*Math.PI/180;
  const dx=cx-r.left-v.x,dy=cy-r.top-v.y;
  return {x:( dx*Math.cos(th)+dy*Math.sin(th))/v.k,y:(-dx*Math.sin(th)+dy*Math.cos(th))/v.k};
}
function measureClick(e){
  const p=screenToSvg(e.clientX,e.clientY),m=state.measure;
  if(!m.a||m.b){m.a=p;m.b=null;drawMeasure();toast('已记录测量起点，点击终点完成测量','info');}
  else{m.b=p;drawMeasure();}
}
function drawMeasure(){
  const ov=$('#cadOverlay'); if(!ov)return;
  const m=state.measure; let h='';
  if(m.a)h+=`<circle cx="${m.a.x.toFixed(1)}" cy="${m.a.y.toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--cad-bg)" stroke-width="2"/>`;
  if(m.a&&m.b){
    const d=Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y);
    const mx=(m.a.x+m.b.x)/2,my=(m.a.y+m.b.y)/2;
    h+=`<line x1="${m.a.x.toFixed(1)}" y1="${m.a.y.toFixed(1)}" x2="${m.b.x.toFixed(1)}" y2="${m.b.y.toFixed(1)}" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="7 4"/>
        <circle cx="${m.b.x.toFixed(1)}" cy="${m.b.y.toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--cad-bg)" stroke-width="2"/>
        <rect x="${(mx-48).toFixed(1)}" y="${(my-30).toFixed(1)}" width="96" height="21" rx="5.5" fill="var(--accent)"/>
        <text x="${mx.toFixed(1)}" y="${(my-15).toFixed(1)}" text-anchor="middle" font-size="11.5" font-family="JetBrains Mono,monospace" fill="var(--accent-ink)">${(d*2).toFixed(1)} mm</text>`;
  }
  ov.innerHTML=h;
}
function toggleMeasure(){
  state.measure.on=!state.measure.on;
  const btn=$('#measureBtn'); if(btn)btn.classList.toggle('on',state.measure.on);
  const cv=$('#vCanvas'); if(cv)cv.style.cursor=state.measure.on?'crosshair':'grab';
  if(!state.measure.on){state.measure.a=state.measure.b=null;drawMeasure();}
  else toast('测量模式：在图纸上点击两点（Esc 退出）· 按 1:2 比例换算','info');
}

const _drag={on:false,x:0,y:0};
function bindViewer(){
  const cv=$('#vCanvas'); if(!cv)return;
  cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15);},{passive:false});
  cv.addEventListener('mousedown',e=>{_drag.on=true;_drag.x=e.clientX;_drag.y=e.clientY;state.view.moved=false;cv.classList.add('dragging');});
  cv.addEventListener('click',e=>{if(state.measure.on&&!state.view.moved)measureClick(e);});
  const mb=$('#measureBtn'); if(mb)mb.classList.toggle('on',state.measure.on);
  cv.style.cursor=state.measure.on?'crosshair':'grab';
  applyView(); drawMeasure();
}
window.addEventListener('mousemove',e=>{
  if(!_drag.on)return;
  const cv=$('#vCanvas'); if(!cv){_drag.on=false;return;}
  const dx=e.clientX-_drag.x,dy=e.clientY-_drag.y;
  if(Math.abs(dx)+Math.abs(dy)>3)state.view.moved=true;
  state.view.x+=dx;state.view.y+=dy;_drag.x=e.clientX;_drag.y=e.clientY;
  applyView();
});
window.addEventListener('mouseup',()=>{_drag.on=false;const cv=$('#vCanvas');if(cv)cv.classList.remove('dragging');});

      </div>
      <div class="note"><i data-lucide="info"></i><div>无序审核：节点可并行处理、不分先后；删除节点不影响历史审核记录。</div></div>`,'保存流程','confirm-flow');break;
    case 'add-node':toast('已添加节点「新节点」· 请配置审核人员（Demo）','info');break;
    case 'rm-node':toast('节点已移除 · 历史审核记录不受影响','warn');break;
    case 'confirm-flow':closeModal();toast('审核流程已更新 · 变更已记录');break;
    case 'add-flow':toast('新增流程：请先配置节点与审核人员（Demo）','info');break;
    case 'restore-item':{
      const it=ADMIN.hiddenList[+d.i];ADMIN.hiddenList.splice(+d.i,1);render();
      toast(`「${it.name}」已恢复 · 重新对用户可见，历史操作留痕`);break;
    }
    case 'close-modal':closeModal();break;
    default:toast('Demo：该功能已触发','info');
  }
}

/* ============================================================
   输入 / 变更 / 键盘事件
   ============================================================ */
document.addEventListener('input',e=>{
  if(e.target.matches('[data-lib-q]')){
    state.libQ=e.target.value;
    const pos=e.target.selectionStart;
    render();
    const inp=document.querySelector('[data-lib-q]');
    if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(_){}}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-filter]')){
    if(t.dataset.filter==='kind')state.libKind=t.value;else state.libStatus=t.value;
    render();
  }else if(t.matches('[data-hist-filter]')){
    state.histFilter=t.value;render();
  }else if(t.matches('[data-layer]')){
    const g=document.getElementById(t.dataset.layer);
    if(g)g.style.display=t.checked?'':'none';
  }else if(t.matches('input[type=radio]')){
    document.querySelectorAll(`input[name="${t.name}"]`).forEach(r=>{
      const row=r.closest('.radio-row');if(row)row.classList.toggle('on',r.checked);
    });
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#modalWrap').classList.contains('show'))closeModal();
    else if(state.measure.on)toggleMeasure();
    closeDropdown();
  }
});
window.addEventListener('resize',()=>{if($('#vCanvas'))fitView();});

   补充样式 & 启动

_cs.textContent=`
  body.maximized{padding:0}
  body.maximized #app{border-radius:0;height:100vh;border-left:none;border-right:none}
  .v-canvas{user-select:none}
`;
document.head.appendChild(_cs);

render();
setTimeout(()=>toast('Demo 已就绪 · 右上角可切换「轻奢 / 科技」×「明 / 暗」四种主题，试试 CAD 预览的滚轮缩放与测量','info'),700);
</script>
